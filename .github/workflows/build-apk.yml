name: Build APK

# 手动触发：仓库页面 → Actions → 左侧 "Build APK" → 右侧 "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # 仓库里的 gradlew 在 git 里没有可执行位（作者在 Windows 上开发），Linux 上 ./gradlew 会报 126
      - name: Fix gradlew permission
        run: chmod +x gradlew

      # 仓库里的 wrapper 指向腾讯镜像（给国内用的）。GitHub 的机器在国外，换回官方源。
      - name: Point Gradle wrapper to the official distribution
        run: sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # 单元测试只是体检，挂了也让 APK 先出来
      - name: Run unit tests (optional)
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-aside-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
